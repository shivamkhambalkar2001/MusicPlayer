
{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <title>Add Song</title>
    <link href="https://netdna.bootstrapcdn.com/font-awesome/4.0.3/css/font-awesome.css" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/mediaelement/4.2.7/mediaelementplayer.min.css" rel="stylesheet"/>
    <link href="{% static 'add_song.css' %}" rel="stylesheet"/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Sofia">
    <style>
        body {
            font-family: 'Sofia', sans-serif;
            background-color: #181818;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 150vh;
            margin: 0;
        }
        .container {
            background-color: #3db9bd;
            padding: 50px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            width: 100%;
        }
        .container h1 {
            margin-top: 10px;
            margin-bottom: 10px;
            text-align: center;
        }
        .container form {
            width: 100%;
        }
        .container form .form-group {
            margin-bottom: 15px;
        }
        .container form label {
            display: block;
            margin-bottom: 5px;
        }
        .container form input[type="text"],
        .container form input[type="file"],
        .container form input[type="date"],
        .container form select {
            width: calc(100% - 20px);
            padding: 10px;
            margin-bottom: 10px;
            border: none;
            border-radius: 5px;
            background-color: #404040;
            color: #ffffff;
        }
        .container form button {
            background-color: #1DB954;
            border: none;
            padding: 10px 20px;
            color: #ffffff;
            cursor: pointer;
            border-radius: 5px;
            width: 100%;
            font-size: 16px;
        }
        .container form button:hover {
            background-color: #1ED760;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Add New Song</h1>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="form-group">
                <label for="id_title">Title:</label>
                {{ form.title }}
            </div>
            <div class="form-group">
                <label for="id_artist">Artist:</label>
                {{ form.artist }}
            </div>
            <div class="form-group">
                <label for="id_album">Album:</label>
                {{ form.album }}
            </div>
            
            <div class="form-group">
                <label for="id_release_date">Release Date:</label>
                {{ form.release_date }}
            </div>
            <div class="form-group">
                <label for="id_image">Image:</label>
                {{ form.image_file }}
            </div>
            <div class="form-group">
                <label for="id_audio_file">Audio File:</label>
                {{ form.audio_file }}
            </div>
            
            <button type="submit">Add Song</button>
        </form>
    </div>
</body>
</html>
